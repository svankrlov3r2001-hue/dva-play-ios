name: Build DVA Play iOS (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional custom release tag (e.g. v1.0.0)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Locate app directory and install npm dependencies
        run: |
          if [ -f "dva_ios/dva-ios/package.json" ]; then
            cd "dva_ios/dva-ios"
          elif [ -f "dva-ios/package.json" ]; then
            cd "dva-ios"
          fi
          echo "APP_DIR=$(pwd)" >> "$GITHUB_ENV"
          npm install --legacy-peer-deps

      - name: Expo Prebuild iOS
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          pod install --repo-update

      - name: Build iOS .app & Package DVA-Play-iOS.ipa
        working-directory: ${{ env.APP_DIR }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          NODE_BIN=$(command -v node || true)
          if [ -n "$NODE_BIN" ]; then
            echo "export NODE_BINARY=$NODE_BIN" > ios/.xcode.env.local
          fi

          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          echo "Detected workspace: $WORKSPACE | project: $PROJECT"
          xcodebuild -list -project "$PROJECT" || true

          SCHEME=$(xcodebuild -list -project "$PROJECT" -json | python3 -c "import sys, json; data = json.load(sys.stdin); schemes = [s for s in data.get('project', {}).get('schemes', []) if not s.endswith(('Tests', 'UITests'))]; print(schemes[0] if schemes else '')")
          if [ -z "$SCHEME" ]; then
            SCHEME=$(basename "$PROJECT" .xcodeproj)
          fi
          echo "Using workspace: $WORKSPACE | project: $PROJECT | scheme: $SCHEME"

          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d ! -path "*.dSYM*" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found after xcodebuild!"
            find build -maxdepth 4 2>/dev/null || true
            exit 1
          fi

          APP_BASENAME=$(basename "$APP_PATH")
          rm -rf build/Payload DVA-Play-iOS.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" "build/Payload/$APP_BASENAME"
          TARGET_APP="build/Payload/$APP_BASENAME"

          if [ -n "$APPLE_CERTIFICATE_BASE64" ] && [ -n "$APPLE_PROVISIONING_PROFILE_BASE64" ]; then
            echo "P12 signing secrets detected - signing $TARGET_APP for direct OTA & Sideloadly..."
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            CERT_PATH="$RUNNER_TEMP/certificate.p12"
            PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
            PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
            ENTITLEMENTS_PATH="$RUNNER_TEMP/entitlements.plist"

            python3 - << 'PYEOF'
          import base64, os, re

          def decode_secret(var_name, out_path):
              raw = os.environ.get(var_name, "")
              cleaned = re.sub(r"\s+", "", raw)
              data = base64.b64decode(cleaned)
              with open(out_path, "wb") as f:
                  f.write(data)

          decode_secret("APPLE_CERTIFICATE_BASE64", os.path.join(os.environ["RUNNER_TEMP"], "certificate.p12"))
          decode_secret("APPLE_PROVISIONING_PROFILE_BASE64", os.path.join(os.environ["RUNNER_TEMP"], "profile.mobileprovision"))
          PYEOF

            security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"

            eval "$(python3 - "$PROFILE_PLIST" "$ENTITLEMENTS_PATH" << 'PYEOF'
          import plistlib, shlex, sys

          profile_plist_path, ent_out_path = sys.argv[1], sys.argv[2]
          with open(profile_plist_path, "rb") as f:
              prof = plistlib.load(f)

          ent = prof.get("Entitlements", {})
          app_id = str(ent.get("application-identifier", ""))
          team_ids = prof.get("TeamIdentifier") or []
          team_id = str(team_ids[0]) if team_ids else str(ent.get("com.apple.developer.team-identifier", ""))
          prefix = f"{team_id}."
          bundle_id = app_id[len(prefix):] if (team_id and app_id.startswith(prefix)) else app_id
          profile_name = str(prof.get("Name", ""))

          minimal_ent = {
              "application-identifier": app_id,
              "com.apple.developer.team-identifier": team_id,
              "get-task-allow": bool(ent.get("get-task-allow", False)),
              "keychain-access-groups": [app_id] if app_id else [],
          }
          with open(ent_out_path, "wb") as f:
              plistlib.dump(minimal_ent, f)

          print(f"PROFILE_APP_ID={shlex.quote(app_id)}")
          print(f"PROFILE_TEAM_ID={shlex.quote(team_id)}")
          print(f"PROFILE_BUNDLE_ID={shlex.quote(bundle_id)}")
          print(f"PROFILE_NAME={shlex.quote(profile_name)}")
          PYEOF
            )"

            if [ -z "$PROFILE_BUNDLE_ID" ] || [ -z "$PROFILE_TEAM_ID" ]; then
              echo "ERROR: Invalid provisioning profile metadata!"
              exit 1
            fi
            echo "Signing Bundle ID: $PROFILE_BUNDLE_ID | Team: $PROFILE_TEAM_ID | Profile: $PROFILE_NAME"

            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            security create-keychain -p "dva-temp-pass" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "dva-temp-pass" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "dva-temp-pass" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

            SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | python3 -c "import re, sys; txt = sys.stdin.read(); m = re.search(r'\b([0-9A-F]{40})\b', txt); print(m.group(1) if m else '')")
            if [ -z "$SIGN_IDENTITY" ]; then
              echo "ERROR: Could not locate valid code signing identity in P12!"
              security find-identity -v "$KEYCHAIN_PATH" || true
              exit 1
            fi
            echo "Using signing identity SHA-1: $SIGN_IDENTITY"

            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $PROFILE_BUNDLE_ID" "$TARGET_APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Delete :DvaSignedBuild" "$TARGET_APP/Info.plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :DvaSignedBuild bool true" "$TARGET_APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Delete :DvaSignedTeamId" "$TARGET_APP/Info.plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :DvaSignedTeamId string $PROFILE_TEAM_ID" "$TARGET_APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Delete :DvaSignedProfileName" "$TARGET_APP/Info.plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :DvaSignedProfileName string $PROFILE_NAME" "$TARGET_APP/Info.plist"

            cp "$PP_PATH" "$TARGET_APP/embedded.mobileprovision"

            find "$TARGET_APP" -type f \( -name "*.dylib" \) | while IFS= read -r target_bin; do
              codesign --force --sign "$SIGN_IDENTITY" --timestamp=none "$target_bin"
            done
            if [ -d "$TARGET_APP/Frameworks" ]; then
              find "$TARGET_APP/Frameworks" -maxdepth 2 -name "*.framework" -type d | while IFS= read -r fw; do
                codesign --force --sign "$SIGN_IDENTITY" --timestamp=none "$fw"
              done
            fi
            if [ -d "$TARGET_APP/PlugIns" ]; then
              find "$TARGET_APP/PlugIns" -maxdepth 2 -name "*.appex" -type d | while IFS= read -r appex; do
                codesign --force --sign "$SIGN_IDENTITY" --entitlements "$ENTITLEMENTS_PATH" --timestamp=none "$appex"
              done
            fi

            codesign --force --sign "$SIGN_IDENTITY" --entitlements "$ENTITLEMENTS_PATH" --timestamp=none "$TARGET_APP"
            codesign --verify --deep --strict --verbose=2 "$TARGET_APP"
          else
            echo "No signing secrets found - packaging unsigned .ipa for Sideloadly / AltStore..."
          fi

          (cd build && zip -qry ../DVA-Play-iOS.ipa Payload)
          ls -lh DVA-Play-iOS.ipa

      - name: Upload DVA-Play-iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DVA-Play-iOS-IPA
          path: ${{ env.APP_DIR }}/DVA-Play-iOS.ipa

      - name: Clean Up Signing Credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/entitlements.plist"
