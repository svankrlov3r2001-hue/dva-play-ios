workflows:
  ios-ipa:
    name: Build DVA Play iOS (.ipa)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_signing
      node: 20.x
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
    scripts:
      - name: Verify & Prepare P12 Signing Keychain
        script: |
          set -e
          SIGN_TMP="$CM_BUILD_DIR/.dva_sign_tmp"
          SIGN_ENV_FILE="$CM_BUILD_DIR/.dva_sign_env"
          rm -rf "$SIGN_TMP" "$SIGN_ENV_FILE"
          mkdir -p "$SIGN_TMP"

          if [ -z "${APPLE_CERTIFICATE_BASE64:-}" ] || [ -z "${APPLE_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "HAS_SIGNING=0" > "$SIGN_ENV_FILE"
            echo "Signing secrets not configured - will build unsigned .ipa for Sideloadly."
            exit 0
          fi

          KEYCHAIN_PATH="$SIGN_TMP/app-signing.keychain-db"
          CERT_PATH="$SIGN_TMP/certificate.p12"
          MACOS_CERT_PATH="$SIGN_TMP/cert_macos.p12"
          PEM_PATH="$SIGN_TMP/bundle.pem"
          PP_PATH="$SIGN_TMP/profile.mobileprovision"
          PROFILE_PLIST="$SIGN_TMP/profile.plist"
          ENTITLEMENTS_PATH="$SIGN_TMP/entitlements.plist"

          python3 - "$SIGN_TMP" << 'PYEOF'
          import base64, os, re, sys

          tmp_dir = sys.argv[1]
          def decode_secret(var_name, out_name):
              raw = os.environ.get(var_name, "")
              cleaned = re.sub(r"\s+", "", raw)
              with open(os.path.join(tmp_dir, out_name), "wb") as f:
                  f.write(base64.b64decode(cleaned))

          decode_secret("APPLE_CERTIFICATE_BASE64", "certificate.p12")
          decode_secret("APPLE_PROVISIONING_PROFILE_BASE64", "profile.mobileprovision")
          PYEOF

          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"

          eval "$(python3 - "$PROFILE_PLIST" "$ENTITLEMENTS_PATH" << 'PYEOF'
          import plistlib, shlex, sys

          profile_plist_path, ent_out_path = sys.argv[1], sys.argv[2]
          with open(profile_plist_path, "rb") as f:
              prof = plistlib.load(f)

          ent = prof.get("Entitlements", {})
          app_id = str(ent.get("application-identifier", ""))
          team_ids = prof.get("TeamIdentifier") or []
          team_id = str(team_ids[0]) if team_ids else str(ent.get("com.apple.developer.team-identifier", ""))
          prefix = f"{team_id}."
          bundle_id = app_id[len(prefix):] if (team_id and app_id.startswith(prefix)) else app_id
          profile_name = str(prof.get("Name", ""))

          minimal_ent = {
              "application-identifier": app_id,
              "com.apple.developer.team-identifier": team_id,
              "get-task-allow": bool(ent.get("get-task-allow", False)),
              "keychain-access-groups": [app_id] if app_id else [],
          }
          with open(ent_out_path, "wb") as f:
              plistlib.dump(minimal_ent, f)

          print(f"PROFILE_APP_ID={shlex.quote(app_id)}")
          print(f"PROFILE_TEAM_ID={shlex.quote(team_id)}")
          print(f"PROFILE_BUNDLE_ID={shlex.quote(bundle_id)}")
          print(f"PROFILE_NAME={shlex.quote(profile_name)}")
          PYEOF
          )"

          if [ -z "$PROFILE_BUNDLE_ID" ] || [ -z "$PROFILE_TEAM_ID" ]; then
            echo "ERROR: Invalid provisioning profile metadata!"
            exit 1
          fi
          echo "Preflight Profile OK -> Bundle ID: $PROFILE_BUNDLE_ID | Team: $PROFILE_TEAM_ID | Profile: $PROFILE_NAME"

          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          security create-keychain -p "dva-temp-pass" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "dva-temp-pass" "$KEYCHAIN_PATH"

          if security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" 2>/dev/null; then
            echo "Imported P12 directly into temporary keychain."
          else
            echo "Direct P12 import failed (OpenSSL 3 PBES2 detected); re-encoding to macOS legacy PKCS#12..."
            OPENSSL_BIN=""
            BREW_OSSL="$(brew --prefix openssl@3 2>/dev/null || true)/bin/openssl"
            for cand in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl "$BREW_OSSL" "$(command -v openssl || true)"; do
              if [ -n "$cand" ] && [ -x "$cand" ]; then
                OPENSSL_BIN="$cand"
                break
              fi
            done
            if [ -z "$OPENSSL_BIN" ]; then
              echo "ERROR: Could not locate openssl binary to convert P12!"
              exit 1
            fi
            echo "Using OpenSSL: $OPENSSL_BIN ($($OPENSSL_BIN version))"

            rm -f "$PEM_PATH" "$MACOS_CERT_PATH"
            if ! "$OPENSSL_BIN" pkcs12 -in "$CERT_PATH" -nodes -passin env:APPLE_CERTIFICATE_PASSWORD -out "$PEM_PATH" 2>/dev/null; then
              "$OPENSSL_BIN" pkcs12 -legacy -in "$CERT_PATH" -nodes -passin env:APPLE_CERTIFICATE_PASSWORD -out "$PEM_PATH"
            fi

            if ! "$OPENSSL_BIN" pkcs12 -export -in "$PEM_PATH" -out "$MACOS_CERT_PATH" -passout pass:dva-p12-temp -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1 2>/dev/null; then
              "$OPENSSL_BIN" pkcs12 -legacy -export -in "$PEM_PATH" -out "$MACOS_CERT_PATH" -passout pass:dva-p12-temp -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
            fi

            security import "$MACOS_CERT_PATH" -P "dva-p12-temp" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            rm -f "$PEM_PATH" "$MACOS_CERT_PATH"
            echo "Imported re-encoded P12 into temporary keychain successfully."
          fi

          curl -fsSL --retry 3 https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$SIGN_TMP/AppleWWDRCAG3.cer" && security import "$SIGN_TMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -A >/dev/null 2>&1 || true
          curl -fsSL --retry 3 https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer -o "$SIGN_TMP/AppleWWDRCAG4.cer" && security import "$SIGN_TMP/AppleWWDRCAG4.cer" -k "$KEYCHAIN_PATH" -A >/dev/null 2>&1 || true

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "dva-temp-pass" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db >/dev/null 2>&1 || security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | python3 -c "import re, sys; txt = sys.stdin.read(); m = re.search(r'\b([0-9A-F]{40})\b', txt); print(m.group(1) if m else '')")
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "ERROR: No valid code signing identity found in temporary keychain!"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "Preflight Signing Identity SHA-1 verified: $SIGN_IDENTITY"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          python3 - "$SIGN_ENV_FILE" "$SIGN_IDENTITY" "$KEYCHAIN_PATH" "$PP_PATH" "$ENTITLEMENTS_PATH" "$PROFILE_APP_ID" "$PROFILE_TEAM_ID" "$PROFILE_BUNDLE_ID" "$PROFILE_NAME" << 'PYEOF'
          import shlex, sys

          out_path, sign_id, kc_path, pp_path, ent_path, app_id, team_id, bundle_id, prof_name = sys.argv[1:10]
          pairs = {
              "HAS_SIGNING": "1",
              "SIGN_IDENTITY": sign_id,
              "KEYCHAIN_PATH": kc_path,
              "PP_PATH": pp_path,
              "ENTITLEMENTS_PATH": ent_path,
              "PROFILE_APP_ID": app_id,
              "PROFILE_TEAM_ID": team_id,
              "PROFILE_BUNDLE_ID": bundle_id,
              "PROFILE_NAME": prof_name,
          }
          with open(out_path, "w") as f:
              for k, v in pairs.items():
                  f.write(f"{k}={shlex.quote(v)}\n")
          PYEOF

      - name: Install npm dependencies & Expo Prebuild iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          if [ -f "dva_ios/dva-ios/package.json" ]; then
            cd "dva_ios/dva-ios"
          elif [ -f "dva-ios/package.json" ]; then
            cd "dva-ios"
          fi
          npm install --legacy-peer-deps
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install --repo-update

      - name: Build iOS .app & Package DVA-Play-iOS.ipa
        script: |
          set -e
          SIGN_TMP="$CM_BUILD_DIR/.dva_sign_tmp"
          SIGN_ENV_FILE="$CM_BUILD_DIR/.dva_sign_env"
          [ -f "$SIGN_ENV_FILE" ] && . "$SIGN_ENV_FILE"

          cd "$CM_BUILD_DIR"
          if [ -f "dva_ios/dva-ios/package.json" ]; then
            cd "dva_ios/dva-ios"
          elif [ -f "dva-ios/package.json" ]; then
            cd "dva-ios"
          fi

          NODE_BIN=$(command -v node || true)
          if [ -n "$NODE_BIN" ]; then
            echo "export NODE_BINARY=$NODE_BIN" > ios/.xcode.env.local
          fi

          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          echo "Detected workspace: $WORKSPACE | project: $PROJECT"

          SCHEME=$(xcodebuild -list -project "$PROJECT" -json | python3 -c "import sys, json; data = json.load(sys.stdin); schemes = [s for s in data.get('project', {}).get('schemes', []) if not s.endswith(('Tests', 'UITests'))]; print(schemes[0] if schemes else '')")
          if [ -z "$SCHEME" ]; then
            SCHEME=$(basename "$PROJECT" .xcodeproj)
          fi
          echo "Using workspace: $WORKSPACE | project: $PROJECT | scheme: $SCHEME"

          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d ! -path "*.dSYM*" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Built .app bundle not found after xcodebuild!"
            find build -maxdepth 4 2>/dev/null || true
            exit 1
          fi

          APP_BASENAME=$(basename "$APP_PATH")
          rm -rf build/Payload "$CM_BUILD_DIR/DVA-Play-iOS.ipa"
          mkdir -p build/Payload
          cp -R "$APP_PATH" "build/Payload/$APP_BASENAME"
          TARGET_APP="build/Payload/$APP_BASENAME"

          if [ "${HAS_SIGNING:-0}" = "1" ]; then
            echo "Signing $TARGET_APP with P12 identity $SIGN_IDENTITY ($PROFILE_BUNDLE_ID)..."
            security unlock-keychain -p "dva-temp-pass" "$KEYCHAIN_PATH"

            rm -rf "$TARGET_APP/_CodeSignature"
            xattr -cr "$TARGET_APP" 2>/dev/null || true
            cp "$PP_PATH" "$TARGET_APP/embedded.mobileprovision"

            python3 - "$TARGET_APP/Info.plist" "$PROFILE_BUNDLE_ID" "$PROFILE_TEAM_ID" "$PROFILE_NAME" << 'PYEOF'
          import plistlib, sys

          plist_path, bundle_id, team_id, prof_name = sys.argv[1:5]
          with open(plist_path, "rb") as f:
              fmt = plistlib.FMT_BINARY
              data = plistlib.load(f)

          data["CFBundleIdentifier"] = bundle_id
          data["DvaSignedBuild"] = True
          data["DvaSignedTeamId"] = team_id
          data["DvaSignedProfileName"] = prof_name

          with open(plist_path, "wb") as f:
              plistlib.dump(data, f, fmt=fmt)
          PYEOF

            find "$TARGET_APP" -type f -name "*.dylib" | while IFS= read -r target_bin; do
              codesign --force --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" --timestamp=none "$target_bin"
            done
            if [ -d "$TARGET_APP/Frameworks" ]; then
              find "$TARGET_APP/Frameworks" -maxdepth 2 -name "*.framework" -type d | while IFS= read -r fw; do
                codesign --force --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" --timestamp=none "$fw"
              done
            fi
            if [ -d "$TARGET_APP/PlugIns" ]; then
              find "$TARGET_APP/PlugIns" -maxdepth 2 -name "*.appex" -type d | while IFS= read -r appex; do
                codesign --force --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$ENTITLEMENTS_PATH" --timestamp=none "$appex"
              done
            fi

            codesign --force --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$ENTITLEMENTS_PATH" --timestamp=none "$TARGET_APP"
            codesign --verify --deep --strict --verbose=2 "$TARGET_APP"
          else
            echo "No signing secrets found - packaging unsigned .ipa for Sideloadly / AltStore..."
          fi

          (cd build && zip -qry "$CM_BUILD_DIR/DVA-Play-iOS.ipa" Payload)
          ls -lh "$CM_BUILD_DIR/DVA-Play-iOS.ipa"

          security delete-keychain "$SIGN_TMP/app-signing.keychain-db" >/dev/null 2>&1 || true
          rm -rf "$SIGN_TMP" "$SIGN_ENV_FILE"
    artifacts:
      - DVA-Play-iOS.ipa
